<!doctype html>
<html lang="ja">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>Yuu Ohnuki | Digital Creator</title>
        <script src="https://cdn.tailwindcss.com"></script>
        <link rel="preconnect" href="https://fonts.googleapis.com" />
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
        <link
            href="https://fonts.googleapis.com/css2?family=Manrope:wght@200;300;400;500;600&family=Syne:wght@400;700;800&display=swap"
            rel="stylesheet"
        />
        <script>
            tailwind.config = {
                theme: {
                    extend: {
                        colors: {
                            cyan: {
                                400: '#22d3ee',
                                500: '#06b6d4',
                            },
                            teal: {
                                400: '#2dd4bf',
                                500: '#14b8a6',
                            },
                        },
                        fontFamily: {
                            sans: ['Manrope', 'sans-serif'],
                            syne: ['Syne', 'sans-serif'],
                        },
                    },
                },
            };
        </script>
        <style>
            body {
                margin: 0;
                padding: 0;
                overflow: hidden; /* Prevent native scroll */
                background-color: #050505;
                font-family: 'Manrope', sans-serif;
                color: #f0f0f0;
            }
            h1,
            h2,
            h3,
            .display-font {
                font-family: 'Syne', sans-serif;
            }
            /* Custom scrollbar hide */
            ::-webkit-scrollbar {
                display: none;
            }
            .noise-overlay {
                position: fixed;
                top: 0;
                left: 0;
                width: 100%;
                height: 100%;
                pointer-events: none;
                z-index: 9999;
                opacity: 0.04;
                background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noiseFilter'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.65' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noiseFilter)'/%3E%3C/svg%3E");
            }
            .custom-scrollbar::-webkit-scrollbar {
                width: 4px;
                display: block;
            }
            .custom-scrollbar::-webkit-scrollbar-track {
                background: rgba(255, 255, 255, 0.05);
            }
            .custom-scrollbar::-webkit-scrollbar-thumb {
                background: rgba(255, 255, 255, 0.2);
                border-radius: 10px;
            }
        </style>
        <script type="importmap">
            {
                "imports": {
                    "react": "https://aistudiocdn.com/react@^19.2.0",
                    "react-dom/": "https://aistudiocdn.com/react-dom@^19.2.0/",
                    "react/": "https://aistudiocdn.com/react@^19.2.0/",
                    "@google/genai": "https://aistudiocdn.com/@google/genai@^1.30.0",
                    "@react-three/fiber": "https://aistudiocdn.com/@react-three/fiber@^9.4.0",
                    "@react-three/drei": "https://aistudiocdn.com/@react-three/drei@^10.7.7",
                    "three": "https://aistudiocdn.com/three@^0.181.2",
                    "framer-motion": "https://aistudiocdn.com/framer-motion@^12.23.24",
                    "lucide-react": "https://aistudiocdn.com/lucide-react@^0.554.0"
                }
            }
        </script>
        <link rel="stylesheet" href="/index.css" />
    </head>
    <body>
        <div id="root"></div>
        <div class="noise-overlay"></div>
        <script type="module" src="/index.tsx"></script>
    </body>
</html>
